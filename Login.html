<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACME AIR - Iniciar sesión</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <main class="contenedor">
        <header>
            <img src="img/logo.png" alt="Logo de ACME AIR">
            <h1>Iniciar sesión</h1>
        </header>

        <form class="formulario" action="menu.html">
            <label for="correo">Correo electrónico</label>
            <input type="email" id="correo" name="correo" required>

            <label for="clave">Contraseña</label>
            <input type="password" id="clave" name="clave" required>

            <div class="recordar">
                <input type="checkbox" id="recordar" name="recordar">
                <label for="recordar">Recordar mis datos</label>
            </div>

            <button type="submit" class="btn-primario">Ingresar</button>
        </form>

        <nav class="enlaces">
            <a href="registro.html">Crear cuenta</a>
            <a href="recuperar-clave.html">¿Has olvidado tu contraseña?</a>
        </nav>
    </main>
</body>
</html>
