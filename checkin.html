<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACME AIR - Check In</title>
  <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="card-container">
        <header class="header">
            <div class="logo-container">
              <img src="img/logo.png" alt="Logo ACME AIR" class="logo-img">
                <div class="logo-text">
                    <h1>ACME AIR</h1>
                    <p>Flying to your dreams</p>
                </div>
            </div>
        </header>

        <main class="main-content">
            
            <div class="user-profile">
                <div class="avatar">
                    <span class="avatar-icon"></span>
                </div>
                <div class="user-info">
                    <h3 class="user-name">!Hola Usuario¡</h3>
                    <a href="login.html" class="logout-link">Cerrar Sesión</a>
                </div>
            </div>

            <hr class="divider">

            <h2 class="title">Check In</h2>

            
            <div class="flight-summary-card">
                <div class="flight-icon"></div>
                <div class="flight-details">
                    <span class="flight-time">05:30 - 06:30</span>
                    <span class="flight-duration">1h 30 min</span>
                    <span class="flight-route">Bogotá - Barranquilla</span>
                </div>
                <div class="flight-code-box">
                    <span class="flight-code">VAA025</span>
                </div>
            </div>

            
            <div class="emergency-container">
                <h4 class="emergency-title">Contacto En Caso De Emergencia</h4>

                <form action="menu.html" method="GET" class="checkin-form">
                    
                    <div class="input-group">
                        <input type="text" placeholder="Nombre completo" required>
                    </div>

                    <div class="input-group">
                        <input type="tel" placeholder="No. Teléfono Celular" required>
                    </div>

                    
                    <button type="submit" class="btn-guardar">GUARDAR</button>

                </form>
            </div>

        </main>
    </div>

</body>
</html>
