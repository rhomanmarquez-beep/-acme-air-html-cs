<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACME AIR - Crear contraseña</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <main class="contenedor">
        <header>
            <img src="img/logo.png" alt="Logo ACME AIR" class="logo-img">
            <h1>Crear contraseña</h1>
        </header>

        <form class="formulario" action="menu.html">
            <label for="clave">Contraseña</label>
            <input type="password" id="clave" name="clave" required>

            <label for="repetir-clave">Repetir contraseña</label>
            <input type="password" id="repetir-clave" name="repetir-clave" required>

            <button type="submit" class="btn-primario">Guardar</button>
        </form>
    </main>
</body>
</html>
