<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACME AIR - Mis Vuelos</title>
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="card-container">
        <header class="header">
            <div class="logo-container">
                <img src="img/logo.png" alt="Logo ACME AIR" class="logo-img">
                <div class="logo-text">
                    <h1>ACME AIR</h1>
                    <p>Flying to your dreams</p>
                </div>
            </div>
        </header>

        <main class="main-content">
           
            <div class="user-profile">
                <div class="avatar">
                    <span class="avatar-icon"></span>
                </div>
                <div class="user-info">
                    <h3 class="user-name">!Hola Usuario¡</h3>
                    <a href="login.html" class="logout-link">Cerrar Sesión</a>
                </div>
            </div>

            <hr class="divider">

            <h2 class="title">Mis Vuelos</h2>

            <div class="flight-list">
                
                
                <div class="flight-card">
                    <div class="flight-icon">✈️</div>
                    <div class="flight-details">
                        <span class="flight-time">05:30 - 06:30</span>
                        <span class="flight-duration">1h 30 min</span>
                        <span class="flight-date">Sep 29</span>
                    </div>
                    <div class="flight-status-info">
                        <span class="flight-code">VAA025</span>
                        <span class="flight-status">A TIEMPO</span>
                        <span class="flight-route">Bogotá - Barranquilla</span>
                    </div>
                </div>

                
                <div class="flight-card">
                    <div class="flight-icon">✈️</div>
                    <div class="flight-details">
                        <span class="flight-time">10:30 - 12:00</span>
                        <span class="flight-duration">1h 30 min</span>
                        <span class="flight-date">Jul 05</span>
                    </div>
                    <div class="flight-status-info">
                        <span class="flight-code">VAA185</span>
                        <span class="flight-status">ATERRIZÓ</span>
                        <span class="flight-route">Bogotá - Barranquilla</span>
                    </div>
                </div>

               
                <div class="flight-card">
                    <div class="flight-icon">✈️</div>
                    <div class="flight-details">
                        <span class="flight-time">05:30 - 06:30</span>
                        <span class="flight-duration">1h 30 min</span>
                        <span class="flight-date">Feb 04</span>
                    </div>
                    <div class="flight-status-info">
                        <span class="flight-code">VAA800</span>
                        <span class="flight-status">ATERRIZÓ</span>
                        <span class="flight-route">Bogotá - Barranquilla</span>
                    </div>
                </div>

            </div>

            
            <a href="menu.html" class="btn-volver">VOLVER</a>

        </main>
    </div>

</body>
</html>
